<style>
:root {
  color-scheme: light;
  --bg: #faf7f3; --panel: #ffffff; --ink: #1d2422; --muted: #6b716e; --line: #e9e3da; --head: #f7f3ed;
  --accent: #0e3c35; --accent-ink: #ffffff; --soft: #e8ede6; --bad: #b3261e; --good: #2f8f63;
  --p1: #f6d6da; --p2: #fbe9b7; --p3: #ded8f1; --p4: #cfe7e0; --p5: #f9ddc8;
  --g-good-bg: #e3f6e6; --g-good: #1c6b2e; --g-mid-bg: #fff2d1; --g-mid: #7a5200; --g-low-bg: #fde4df; --g-low: #a3261b;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 6px 20px rgba(60, 45, 20, .07);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
header.top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  background: transparent; color: var(--accent);
}

header.top h1 { font-family: "NBTitle", "Tenor Sans", ui-rounded, system-ui, sans-serif; font-size: 26px; font-weight: 400; letter-spacing: .2px; margin: 0; flex: none; white-space: nowrap; }
header.top button { background: rgba(255, 255, 255, .72); border-color: transparent; color: var(--accent); width: 38px; height: 38px; }
#syncRow[data-state=off] .arrows { opacity: .45; }
#syncRow[data-state=busy] svg { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #syncRow[data-state=busy] svg { animation: none; } }
#drawer button.syncrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#drawer button.syncrow small { display: block; color: var(--muted); font-size: 12.5px; }
#drawer button.syncrow .st { display: inline-flex; color: var(--accent); }
#drawerTab[data-sync=error]::after, #drawerTab[data-sync=login]::after, #drawerTab[data-sync=pw]::after { content: ""; position: absolute; top: -4px; left: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); border: 2px solid #fff; }
header.top button:hover { border-color: var(--accent); }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { #status { display: none; } header.top { gap: 8px; } header.top h1 { font-size: 23px; } }

#greet { flex: 1; min-width: 0; text-align: center; line-height: 1; color: var(--accent); cursor: pointer; }
#greet svg { max-width: 100%; height: auto; overflow: visible; vertical-align: middle; }
#greet text { white-space: pre; }
#greet .ink { fill: currentColor; }
#greet mask tspan { fill: #fff; fill-opacity: 0; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
@keyframes penstroke { to { stroke-dashoffset: 0; } }
@keyframes penfill { to { fill-opacity: 1; } }
/* Reiter verschieben */
.tabs.reorder button[data-id] { touch-action: none; cursor: grab; opacity: 1 !important; outline: 2px dashed var(--accent); outline-offset: 1px; animation: wiggle .28s ease-in-out infinite alternate; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tabs.reorder button[data-id]:nth-child(even) { animation-direction: alternate-reverse; }
.tabs.reorder button.dragging { animation: none; position: relative; z-index: 5; cursor: grabbing; box-shadow: 0 8px 18px rgba(0, 0, 0, .22); }
.tabs button.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@keyframes wiggle { from { rotate: -1.6deg; } to { rotate: 1.6deg; } }
/* Zeile hervorheben / Einzelansicht */
td.name, td.avg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
tbody tr.hl > td, tbody tr.hl:hover > td, tbody tr.hl > td.note { background: var(--p2); }
.solo { display: flex; align-items: center; gap: 10px; background: var(--p2); border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; font-weight: 600; }
.solo span { flex: 1; }
/* Jahreszeiten-Hintergrund: Aquarell und gemalte Motive, nach unten auslaufend */
#season { position: absolute; top: 0; left: 0; right: 0; height: 440px; overflow: hidden; pointer-events: none; z-index: 0; }
#season .wash { position: absolute; inset: -60px -50px auto -50px; height: 380px; opacity: 0; filter: url(#watery); animation: wash .8s ease-out .05s forwards; will-change: opacity;
  -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent 100%); mask-image: linear-gradient(to bottom, #000 20%, transparent 100%); }
#season svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#season .dd { opacity: 0; animation: ddpop .4s ease-out forwards; }
@keyframes wash { from { opacity: 0; } to { opacity: .72; } }
@keyframes ddpop { from { opacity: 0; } to { opacity: var(--o, .4); } }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
#greet .dot { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .25s ease-out forwards; }
header.top, .tabs, main { position: relative; z-index: 1; }
@media (max-width: 899px) { #status { display: none; } }
@media (max-width: 700px) { header.top { flex-wrap: wrap; } header.top h1 { flex: 1; } #greet { order: 9; flex-basis: 100%; margin-top: 2px; } }

button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, box-shadow .15s, transform .05s;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; box-shadow: 0 2px 6px rgba(14, 60, 53, .22); }
button.danger { color: var(--bad); }
button.danger:hover { border-color: var(--bad); }
button.small { padding: 5px 10px; font-size: 13px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; width: 100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border-radius: 999px; padding: 9px 18px; color: var(--muted); background: var(--panel); font-weight: 600; flex: none; }
.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 2px 8px rgba(14, 60, 53, .22); }
.tabs button.add { border-style: dashed; background: transparent; font-weight: 400; }
#classTabs button:not(.add) { color: var(--ink); border-color: transparent; background: var(--p1); }
#classTabs button:not(.add):nth-child(5n+2) { background: var(--p2); }
#classTabs button:not(.add):nth-child(5n+3) { background: var(--p3); }
#classTabs button:not(.add):nth-child(5n+4) { background: var(--p4); }
#classTabs button:not(.add):nth-child(5n+5) { background: var(--p5); }
#classTabs button.active { box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
#classTabs button:not(.active):not(.add) { opacity: .75; }
.namebtn { border: none; background: transparent; padding: 4px 6px; margin: -4px -6px; text-align: left; font: inherit; font-weight: 500; white-space: normal; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }
.namebtn:hover { background: var(--soft); }
.nbadge { background: var(--p2); color: var(--ink); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.notes { list-style: none; margin: 14px 0 0; padding: 0; max-height: 38vh; overflow-y: auto; }
.notes li { background: var(--head); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
.notes li .tx { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes li .tx small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
dialog.dlg textarea.notein { min-height: 110px; }
.dictrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
button.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.tabs.sub { padding: 10px 16px 12px; }
.tabs.sub button { font-size: 14px; padding: 6px 14px; font-weight: 500; }
.tabs.sub button.active { background: var(--soft); border-color: var(--accent); color: var(--ink); font-weight: 600; box-shadow: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); margin: 0 12px 24px; padding: 6px 16px 20px; min-height: 55vh; }
@media (max-width: 560px) { .panel { margin: 0 8px 16px; padding: 4px 12px 16px; border-radius: 16px; } .tabs, .tabs.sub { padding-left: 10px; padding-right: 10px; } }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; }
.bar .grow { flex: 1; }
.bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty button { margin-top: 12px; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: center; vertical-align: middle; }
tr:last-child > td { border-bottom: none; }
thead th { background: var(--head); font-size: 13px; font-weight: 600; border-bottom: 2px solid var(--line); }
tbody tr:hover > td { background: var(--head); }
tfoot td { background: var(--head); font-size: 13px; color: var(--muted); border-top: 2px solid var(--line); }
th.name, td.name { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 150px; max-width: 220px; background: var(--panel); border-right: 1px solid var(--line); font-weight: 500; }
thead th.name, tfoot td.name { background: var(--head); }
th .colbtn { border: none; background: transparent; padding: 3px 6px; font-weight: 600; display: block; width: 100%; border-radius: 8px; }
th .colbtn:hover { background: var(--soft); }
th .colbtn small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
td.cell { min-width: 84px; }
td.cell input.grade { width: 56px; text-align: center; padding: 6px 4px; font-weight: 700; border-radius: 10px; }

<script>
'use strict';
const KEY = 'lehrerkalender.v1';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

/* ---------- Daten ---------- */
function emptyState() {
  return { version: 2, classes: [], deleted: {}, settings: { tendency: 0.25, showTs: true }, ui: { classId: null, tabId: 'students' }, lastBackup: null };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(emptyState(), JSON.parse(raw));
  } catch (e) { console.error(e); }
  return emptyState();
}
let S = load();
function save() { saveLocal(); markDirty(); }
function saveLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    setStatus(S.settings.showTs ? 'Gespeichert ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : 'Gespeichert');
  } catch (e) {
    setStatus('Speichern fehlgeschlagen!');
    alert('Die Daten konnten nicht gespeichert werden: ' + e.message);
  }
}
function setStatus(t) { document.getElementById('status').textContent = t; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
const curClass = () => S.classes.find(c => c.id === S.ui.classId) || null;
const nowIso = () => new Date().toISOString();
const markDeleted = id => { S.deleted[id] = nowIso(); };

/* Zellen: gelöschte Einträge bleiben als { v: null } mit Zeitstempel erhalten,
   damit eine Löschung beim Zusammenführen nicht wieder auftaucht. */
function getCell(tab, sid, colId) {
  const c = (tab.cells[sid] || {})[colId];
  return c && c.v != null ? c : null;
}
function setCell(tab, sid, colId, v) {
  const cells = tab.cells[sid] || (tab.cells[sid] = {});
  const c = cells[colId], n = nowIso();
  if (v == null || v === '') { if (c && c.v != null) cells[colId] = { v: null, t: c.t, m: n }; }
  else if (!c || c.v == null) cells[colId] = { v, t: n, m: n };
  else if (c.v !== v) { c.v = v; c.m = n; }
  return getCell(tab, sid, colId);
}

/* ---------- Zusammenführen zweier Stände ---------- */
function newer(a, b) { return (b.m || '') > (a.m || '') ? b : a; }
function mergeList(a, b, deleted, mergeItem) {
  const bm = new Map(b.map(x => [x.id, x])), seen = new Set(), out = [];
  for (const x of a) {
    seen.add(x.id);
    if (deleted[x.id]) continue;
    const y = bm.get(x.id);
    out.push(y ? mergeItem(x, y) : x);
  }
  for (const y of b) if (!seen.has(y.id) && !deleted[y.id]) out.push(y);
  return out;
}
function mergeTab(a, b, deleted) {
  const top = newer(a, b);
  const t = { id: a.id, type: a.type, name: top.name, m: top.m, columns: mergeList(a.columns, b.columns, deleted, newer), cells: {} };
  if (a.type === 'grades') {
    const src = (b.catM || '') > (a.catM || '') ? b : a;
    t.categories = src.categories; t.catM = src.catM;
    const ids = new Set(t.categories.map(c => c.id));
    t.columns.forEach(col => { if (!ids.has(col.catId)) col.catId = t.categories[0].id; });
  }
  for (const sid of new Set([...Object.keys(a.cells), ...Object.keys(b.cells)])) {
    if (deleted[sid]) continue;
    const ca = a.cells[sid] || {}, cb = b.cells[sid] || {}, out = {};
    for (const cid of new Set([...Object.keys(ca), ...Object.keys(cb)])) {
      if (deleted[cid]) continue;
      out[cid] = ca[cid] && cb[cid] ? newer(ca[cid], cb[cid]) : (ca[cid] || cb[cid]);
    }
    t.cells[sid] = out;
  }
  return t;
}
function mergeState(a, b) {
  const deleted = { ...(b.deleted || {}), ...(a.deleted || {}) };
  // Schüler: Name vom neueren Stand, Notizen von beiden Seiten zusammengeführt.
  const mergeStudent = (x, y) => {
    const out = { ...newer(x, y) };
    const notes = mergeList(x.notes || [], y.notes || [], deleted, newer)
      .sort((p, q) => (p.t || '').localeCompare(q.t || '') || p.id.localeCompare(q.id));
    if (notes.length) out.notes = notes; else delete out.notes;
    return out;
  };
  const out = Object.assign(emptyState(), a, { deleted });
  const mergeClass = (x, y) => {
    const top = newer(x, y);
    // Reihenfolge der Schüler und der Reiter: Es gilt die Seite, auf der zuletzt sortiert wurde.
    const yFirst = (y.orderM || '') > (x.orderM || '');
    const yTabs = (y.tabOrderM || '') > (x.tabOrderM || '');
    const c = { id: x.id, name: top.name, m: top.m, orderM: yFirst ? y.orderM : x.orderM,
      students: yFirst ? mergeList(y.students, x.students, deleted, mergeStudent) : mergeList(x.students, y.students, deleted, mergeStudent),
      tabs: yTabs ? mergeList(y.tabs, x.tabs, deleted, (q, p) => mergeTab(p, q, deleted)) : mergeList(x.tabs, y.tabs, deleted, (p, q) => mergeTab(p, q, deleted)) };
    const tm = yTabs ? y.tabOrderM : x.tabOrderM;
    if (tm) c.tabOrderM = tm;
    return c;
  };
  // Reihenfolge der Klassen: ebenfalls die zuletzt sortierte Seite.
  const bClasses = b.classes || [], bFirst = (b.classOrderM || '') > (a.classOrderM || '');
  out.classes = bFirst ? mergeList(bClasses, a.classes, deleted, (y, x) => mergeClass(x, y)) : mergeList(a.classes, bClasses, deleted, mergeClass);
  const cm = bFirst ? b.classOrderM : a.classOrderM;
  if (cm) out.classOrderM = cm; else delete out.classOrderM;
  const sNew = newer(a.settings || {}, b.settings || {});
  out.settings = { ...a.settings, m: sNew.m };
  if (sNew.tendency != null) out.settings.tendency = sNew.tendency;
  if (sNew.name != null) out.settings.name = sNew.name;
  if (sNew.halfWeights) out.settings.halfWeights = sNew.halfWeights;
  if ((b.lastBackup || '') > (a.lastBackup || '')) out.lastBackup = b.lastBackup;
  return out;
}

/* ---------- Hilfen ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = true;
    else e.setAttribute(k, v === true ? '' : v);
  }
  return e;
}
const fmtNum = n => n.toFixed(2).replace('.', ',');
function fmtTs(iso, long) {
  const d = new Date(iso);
  return long
    ? d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function tsTitle(c) {
  if (!c || !S.settings.showTs) return '';   // Schalter „Zeitstempel anzeigen“ aus: auch kein Hinweis beim Darüberfahren
  return 'Eingetragen: ' + fmtTs(c.t, true) + (c.m !== c.t ? '\nGeändert: ' + fmtTs(c.m, true) : '');
}
function tsText(c) {
  if (!c) return '';
  return fmtTs(c.m) + (c.m !== c.t ? ' ✎' : '');
}

/* ---------- Dialoge ---------- */
const KEEP = Symbol('keep');
/* Oben links ✕ = abbrechen/schließen, oben rechts ✓ = speichern und schließen.
   Weitere Aktionen (z. B. Löschen) bleiben als Knöpfe unten. */
/* Aufklapp-Variante der Einstellungs-Leiste: Ist dlgHost gesetzt, wird das nächste Fenster
   nicht als eigenes Fenster geöffnet, sondern an dieser Stelle eingebettet. */
let dlgHost = null;
const inlineCancels = new Set();
function dlg(title, content, actions) {
  return new Promise(resolve => {
    const host = dlgHost; dlgHost = null;
    const primary = actions.find(a => a.primary);
    const isCancel = a => !a.primary && !a.fn && !a.cls && (a.value == null || a.value === false);
    const cancel = actions.find(isCancel);
    const cancelVal = cancel ? cancel.value : null;
    if (host) {
      let done = false;
      const cancelFn = () => close(cancelVal);
      const close = v => {
        if (done) return; done = true;
        inlineCancels.delete(cancelFn); host.cancel = null; host.replaceChildren();
        if (host.onclose) host.onclose();
        resolve(v);
      };
      const run = async a => { const v = a.fn ? await a.fn() : a.value; if (v !== KEEP) close(v); };
      const btns = actions.filter(a => !isCancel(a) && !a.modalOnly);
      host.replaceChildren(h('form', { class: 'inline', onsubmit: e => { e.preventDefault(); if (primary) run(primary); } }, content,
        btns.length ? h('div', { class: 'dlg-actions' }, btns.map(a =>
          h('button', { type: a.primary ? 'submit' : 'button', class: a.cls ? a.cls.replace('left', '').trim() : (a.primary ? 'primary' : ''), onclick: a.primary ? null : () => run(a) }, a.label))) : null));
      host.cancel = cancelFn; inlineCancels.add(cancelFn);
      return;
    }
    const d = h('dialog', { class: 'dlg' });
    const close = v => { d.close(); d.remove(); resolve(v); };
    const run = async a => { const v = a.fn ? await a.fn() : a.value; if (v !== KEEP) close(v); };
    const asCheck = primary && !primary.button;
    const extras = actions.filter(a => !isCancel(a) && !(a === primary && asCheck));
    const x = iconBtn('close', cancel ? cancel.label : 'Schließen', () => close(cancelVal));
    let ok = h('span', { class: 'dlg-sp' });
    if (asCheck) { ok = iconBtn('check', primary.label); ok.type = 'submit'; ok.classList.add('primary'); }
    const form = h('form', { onsubmit: e => { e.preventDefault(); if (primary) run(primary); } },
      h('div', { class: 'dlg-head' }, x, h('h2', {}, title), ok), content,
      actions.heading ? h('h3', { class: 'sec low' }, actions.heading) : null,
      extras.length ? h('div', { class: 'dlg-actions' + (actions.stack ? ' stack' : '') }, extras.map(a =>
        h('button', { type: a.primary ? 'submit' : 'button', class: a.cls || (a.primary ? 'primary' : ''), onclick: a.primary ? null : () => run(a) }, a.label))) : null);
    d.append(form);
    d.addEventListener('cancel', e => { e.preventDefault(); close(cancelVal); });
    document.body.append(d);
    d.showModal();
    const f = d.querySelector('input[type=text], input[type=password], textarea');
    if (f) { f.focus(); f.select(); } else d.focus();
  });
}
function field(label, input) { return h('label', { class: 'field' }, h('span', {}, label), input); }
function askText(title, label, value, okLabel) {
  const inp = h('input', { type: 'text', value: value || '' });
  return dlg(title, field(label, inp), [
    { label: 'Abbrechen', value: null },
    { label: okLabel || 'Speichern', primary: true, fn: () => inp.value.trim() || KEEP }
  ]);
}
function confirmDlg(title, text, okLabel) {
  return dlg(title, h('p', {}, text), [
    { label: 'Abbrechen', value: false },
    { label: okLabel || 'Löschen', cls: 'danger', value: true }
  ]);
}

/* ---------- Noten ---------- */
const GRADE_RE = /^[1-6][+-]?$/;
function gradeVal(v) {
  let n = +v[0];
  const t = S.settings.tendency;
  if (v[1] === '+') n -= t;
  if (v[1] === '-') n += t;
  return n;
}
/* Halbjahre: Jede Leistung gehört zu Halbjahr 1 oder 2 (ohne Angabe: 1).
   Zeugnisnote eines Halbjahrs = gewichtetes Mittel der Bereichsdurchschnitte
   (Standard: Allgemeine Leistungen und Klassenarbeiten je zur Hälfte).
   Jahresnote: je Bereich (1. Halbjahr × 1 + 2. Halbjahr × 2) ÷ 3, danach das Mittel der Bereiche.
   Gerechnet wird durchgehend mit ungerundeten Werten. */
/* Gewichte der Halbjahre für die Jahresnote; in den Einstellungen änderbar (Standard 1 : 2). */
function halfW() {
  const w = S.settings.halfWeights;
  return Array.isArray(w) && w[0] >= 0 && w[1] >= 0 && w[0] + w[1] > 0 ? { 1: w[0], 2: w[1] } : { 1: 1, 2: 2 };
}
const colHalf = col => col.half === 2 ? 2 : 1;
function catAvg(tab, sid, catId, half) {
  let s = 0, f = 0;
  for (const col of tab.columns) {
    if (col.catId !== catId || colHalf(col) !== half) continue;
    const c = getCell(tab, sid, col.id);
    if (c) { s += gradeVal(c.v) * col.factor; f += col.factor; }
  }
  return f > 0 ? s / f : null;
}
function catYear(tab, sid, catId) {

/* view: 1, 2 (Halbjahr) oder 'J' (Jahr) */
function calcStudent(tab, sid, view) {

  for (const cat of tab.categories) {
    const v = view === 'J' ? catYear(tab, sid, cat.id) : catAvg(tab, sid, cat.id, view);

}

function calcColumns(tab, view) {

    defs.push({ label: 'Zeugnisnote', sub: view + '. Halbjahr', final: true, get: sid => calcStudent(tab, sid, view) });

}

/* Reiter mit data-id per Ziehen umsortieren; commit bekommt die neue Reihenfolge der IDs. */
function makeSortable(nav, commit) {
  nav.querySelectorAll('button[data-id]').forEach(pill => {
    pill.addEventListener('pointerdown', e => {
      if (e.button) return;
      e.preventDefault();
      let startX = e.clientX, moved = false;
      try { pill.setPointerCapture(e.pointerId); } catch (err) {}
      pill.classList.add('dragging');
      const move = ev => {
        let dx = ev.clientX - startX;
        pill.style.transform = 'translateX(' + dx + 'px)';
        const r = pill.getBoundingClientRect(), mid = r.left + r.width / 2;
        const prev = pill.previousElementSibling, next = pill.nextElementSibling;
        let hit = false, before = null;
        if (next && next.dataset.id) { const n = next.getBoundingClientRect(); if (mid > n.left + n.width / 2) { hit = true; before = next.nextElementSibling; } }
        if (!hit && prev && prev.dataset.id) { const p = prev.getBoundingClientRect(); if (mid < p.left + p.width / 2) { hit = true; before = prev; } }
        if (!hit) return;
        const visual = r.left;
        pill.style.transform = '';
        nav.insertBefore(pill, before);
        dx = visual - pill.getBoundingClientRect().left; startX = ev.clientX - dx;
        pill.style.transform = 'translateX(' + dx + 'px)';
        moved = true;
      };
      const up = () => {
        pill.removeEventListener('pointermove', move); pill.removeEventListener('pointerup', up); pill.removeEventListener('pointercancel', up);
        pill.style.transform = ''; pill.classList.remove('dragging');
        if (moved) commit([...nav.querySelectorAll('button[data-id]')].map(b => b.dataset.id));
      };
      pill.addEventListener('pointermove', move); pill.addEventListener('pointerup', up); pill.addEventListener('pointercancel', up);
    });
  });
}

const startReorder = kind => { reorder = kind; render(); };

/* Den nächsten Klick schlucken (z. B. beim Loslassen nach langem Drücken). */
function eatNextClick() {
  const eat = ev => { ev.stopPropagation(); ev.preventDefault(); };
  document.addEventListener('click', eat, { capture: true, once: true });
  setTimeout(() => document.removeEventListener('click', eat, true), 500);
}
/* Lange auf eine Zeile drücken: erst farbig hervorheben, bei noch längerem Drücken nur diese Zeile zeigen. */
function rowPress(tr, st) {
  if (rowView.hl === st.id) tr.classList.add('hl');
  tr.addEventListener('pointerdown', e => {
    if (e.button || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.closest('button.check')) return;
    const x = e.clientX, y = e.clientY;
    let stage = 0;
    const stop = () => {
      clearTimeout(t1); clearTimeout(t2);
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', stop);
    };
    const up = () => { stop(); if (stage) eatNextClick(); };
    const move = ev => { if (Math.hypot(ev.clientX - x, ev.clientY - y) > 10) stop(); };
    const t1 = setTimeout(() => {
      stage = 1;
      const on = rowView.hl !== st.id;
      tr.parentNode.querySelectorAll('tr.hl').forEach(r => r.classList.remove('hl'));
      rowView.hl = on ? st.id : null; tr.classList.toggle('hl', on);
    }, 500);
    const t2 = setTimeout(() => {
      stop();
      rowView.solo = st.id; rowView.hl = null;
      document.addEventListener('pointerup', eatNextClick, { once: true });
      render();
    }, 1700);
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', stop);
  });
}

  el.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - x, e.clientY - y) > 10) clear(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, clear));
  el.addEventListener('click', () => { if (fired) { fired = false; return; } onTap(); });
  el.addEventListener('contextmenu', e => { e.preventDefault(); if (e.button === 2 && !fired) onHold(); });
  el.classList.add('hold');
  return el;
}

/* Berechnung: Wert der Tendenzen und Gewichte der Halbjahre (gilt für alle Fächer). */
function calcFields() {
  const tend = h('select', { value: String(S.settings.tendency) },
    h('option', { value: '0.25' }, '0,25 (2+ = 1,75 · 2− = 2,25)'),
    h('option', { value: '0.33' }, '0,33 (2+ = 1,67 · 2− = 2,33)'),
    h('option', { value: '0' }, 'Tendenzen nicht einrechnen'));
  tend.addEventListener('change', () => { S.settings.tendency = +tend.value; S.settings.m = nowIso(); save(); render(); });
  const w = halfW();
  const num = v => h('input', { type: 'number', class: 'num', min: '0', step: '0.5', inputmode: 'decimal', value: v });
  const w1 = num(w[1]), w2 = num(w[2]);
  const formula = h('p', { class: 'hint' });
  const showFormula = () => {
    const c = halfW(), f = n => String(n).replace('.', ',');
    formula.textContent = 'Jahr je Bereich = (1. Halbjahr × ' + f(c[1]) + ' + 2. Halbjahr × ' + f(c[2]) + ') ÷ ' + f(c[1] + c[2]);
  };
  const commit = () => {
    const a = +w1.value, b = +w2.value;
    if (!(a >= 0 && b >= 0 && a + b > 0)) { formula.textContent = 'Bitte zwei Zahlen ab 0 eingeben, mindestens eine größer als 0.'; return; }

const foldMode = () => S.ui.fold !== false;

  const act = (label, fn, danger, btn) => {

    btn.classList.add('row'); if (danger) btn.classList.add('danger');
    if (!folding) { btn.addEventListener('click', () => { toggleDrawer(false); fn(); }); return [btn]; }
    const body = h('div', { class: 'fold-body', hidden: true });

      try {
        rec = new SR(); rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = true;
        rec.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript; ta.value = base + s; };

/* ---------- Import ---------- */
function namesFromRows(rows) {
  rows = rows.map(r => r.map(c => String(c == null ? '' : c).trim())).filter(r => r.some(c => c));
  if (!rows.length) return [];
  const head = rows[0].map(c => c.toLowerCase());
  const iN = head.findIndex(c => /^(nachname|familienname|name)$/.test(c));
  const iV = head.findIndex(c => /^(vorname|rufname)$/.test(c));
  if (iN >= 0 || iV >= 0) {
    return rows.slice(1).map(r => [iN >= 0 ? r[iN] : '', iV >= 0 ? r[iV] : ''].filter(Boolean).join(', ')).filter(Boolean);
  }
  return rows.map(r => r.filter(c => c && !/^\d+[.)]?$/.test(c)).slice(0, 2).join(', ')).filter(Boolean);
}
function rowsFromText(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  const delim = text.includes(';') ? ';' : text.includes('\t') ? '\t' : ',';
  return lines.map(l => l.split(delim).map(c => c.trim().replace(/^"(.*)"$/, '$1')));
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Laden fehlgeschlagen'));
    document.head.append(s);
  });
}
async function namesFromFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.(xlsx|xls|ods)$/i.test(file.name)) {
    if (!window.XLSX) {
      try { await loadScript(XLSX_URL); }
      catch (e) { throw new Error('Für Excel-Dateien wird einmalig eine Internetverbindung benötigt. Alternativ die Liste als CSV speichern oder die Namen einfügen.'); }
    }
    const wb = XLSX.read(buf, { type: 'array' });
    return namesFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }));
  }
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
  return namesFromRows(rowsFromText(text));
}
async function importStudents(cls) {
  const ta = h('textarea', { placeholder: 'Ein Name pro Zeile, z. B.\nMüller, Anna\nSchmidt, Ben' });
  const msg = h('p', { class: 'hint' }, 'Datei wählen oder Namen einfügen. Die Liste kann vor dem Import bearbeitet werden.');
  const file = h('input', { type: 'file', accept: '.csv,.txt,.xlsx,.xls,.ods', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const names = await namesFromFile(f);
      ta.value = names.join('\n');
      msg.textContent = names.length + ' Namen aus „' + f.name + '“ gelesen. Bitte prüfen.';
    } catch (err) { msg.textContent = err.message; }
  } });
  const ok = await dlg('Namensliste importieren – ' + cls.name, h('div', {}, field('Datei (CSV oder Excel)', file), field('Namen', ta), msg), [
    { label: 'Abbrechen', value: null },
    { label: 'Importieren', primary: true, value: true }
  ]);
  if (!ok) return;
  const have = new Set(cls.students.map(s => s.name.toLowerCase()));
  let n = 0;
  for (const line of ta.value.split(/\r?\n/)) {
    const name = line.trim();
    if (!name || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    cls.students.push({ id: uid(), name, m: nowIso() }); n++;
  }
  save(); render();
  setStatus(n + ' Schüler importiert');
}

async function login(silent) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));

  const p = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT, response_mode: 'query',
    scope: SCOPE, state, code_challenge: challenge, code_challenge_method: 'S256' });

}
async function tokenRequest(params) {
  const r = await fetch(AUTH_URL + 'token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, scope: SCOPE, ...params }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error_description || j.error || ('HTTP ' + r.status)); e.code = j.error; throw e; }

  const pk = readJson(PKCE_KEY) || {};

  history.replaceState(null, '', location.pathname);
  if (q.has('error')) {
    if (pk.silent) { if (auth) { auth.needLogin = true; auth.silentFailed = true; saveAuth(); } }
    else if (q.get('error') !== 'access_denied') alert('Anmeldung fehlgeschlagen: ' + (q.get('error_description') || q.get('error')));
    return;
  }
  if (!pk.verifier || pk.state !== q.get('state')) { alert('Die Anmeldung konnte nicht zugeordnet werden. Bitte erneut versuchen.'); return; }
  try {
    storeTokens(await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: pk.verifier }), true);
  } catch (e) { alert('Anmeldung fehlgeschlagen: ' + e.message); }

  if (!auth || auth.needLogin) return null;

  if (!auth.refresh) { auth.needLogin = true; saveAuth(); return null; }
  try {
    storeTokens(await tokenRequest({ grant_type: 'refresh_token', refresh_token: auth.refresh }));
    return auth.access;
  } catch (e) {
    if (e.code === 'invalid_grant' || e.code === 'interaction_required') { auth.needLogin = true; saveAuth(); return null; }
    throw e;

async function httpError(r) {

/* Die Datei enthält die Daten als Funktionsaufruf: __notenbuch({...}); */
const WRAP = '__notenbuch';

  const t = text.trim();

  return JSON.parse(t.slice(WRAP.length + 1, -2));
}
function loadByScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    let finished = false;
    const done = (err, value) => {
      if (finished) return;
      finished = true; clearTimeout(timer); delete window[WRAP]; s.remove();
      if (err) reject(err); else resolve(value);
    };
    const timer = setTimeout(() => done(new Error('Zeitüberschreitung')), 20000);
    window[WRAP] = value => done(null, value);
    s.onerror = () => done(new Error('Skript wurde nicht geladen'));
    s.onload = () => setTimeout(() => done(new Error('Skript ohne Daten')), 0);
    s.src = url;
    document.head.append(s);
  });
}
const cloud = {
  async meta(token) {
    const r = await fetch(FILE_URL, { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 404) return null;
    if (!r.ok) throw await httpError(r);
    return r.json();
  },
  async download(meta, token) {
    // Erster Weg: die vorab berechtigte Download-Adresse. Zweiter Weg: über Graph mit Anmeldung.
    const url = meta['@microsoft.graph.downloadUrl'] || meta['@content.downloadUrl'];
    let first = 'keine Download-Adresse erhalten';
    if (url) {
      try {
        const r = await fetch(url);
        if (r.ok) return unwrap(await r.text());
        first = 'HTTP ' + r.status;
      } catch (e) { first = e.message; }
    }
    let second;
    try {
      const r = await fetch(FILE_URL + ':/content', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw await httpError(r);
      return unwrap(await r.text());
    } catch (e) { second = e.message; }
    // Dritter Weg: Die Datei ist als Skript verpackt und lässt sich deshalb auch dann laden,
    // wenn der Download-Server dem Browser das direkte Auslesen nicht erlaubt.
    let third = 'keine Download-Adresse';
    if (url) {
      try { return await loadByScript(url); } catch (e) { third = e.message; }

      try { await fetch(url, { mode: 'no-cors' }); probe = 'Server erreichbar'; } catch (e) { probe = 'Server nicht erreichbar'; }
    }

/* Nur diese Teile werden abgeglichen; Ansicht und Geräte-Einstellungen bleiben lokal. */
function strip(s) {
  return { version: s.version, classOrderM: s.classOrderM, classes: s.classes, deleted: s.deleted || {}, settings: { tendency: s.settings.tendency, name: s.settings.name, halfWeights: s.settings.halfWeights, m: s.settings.m } };
}
function canon(v) {
  return JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
    ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
}
const uiBusy = () => !!reorder || !!document.querySelector('dialog[open]') ||
  /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
function scheduleSync(ms) { if (!auth) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), ms); }

async function sync(force) {
  if (!auth || syncing) return;
  if (!navigator.onLine) { setSync('offline', 'Keine Verbindung – der Abgleich folgt automatisch.'); return; }
  syncing = true; setSync('busy');
  let step = 'Anmeldung prüfen';
  try {
    const token = await getToken();
    if (!token) { setSync('login', 'Bitte erneut bei Microsoft anmelden.'); return; }
    if (auth.needPw && !auth.overwrite) { setSync('pw', PW_MSG); return; }
    const gen = dirtyGen;
    step = 'Dateiinfo abrufen';
    const meta = await cloud.meta(token);
    if (meta && !force && !auth.dirty && meta.eTag === auth.etag) { auth.last = nowIso(); saveAuth(); setSync('ok'); return; }
    step = 'Herunterladen';
    const raw = meta && !auth.overwrite ? await cloud.download(meta, token) : null;
    step = 'Zusammenführen';
    let remote = null;
    if (raw && raw.enc) {
      try {
        if (!auth.key || auth.salt !== raw.salt) throw new Error('Schlüssel fehlt');
        remote = await decryptRaw(raw, auth.key);
      } catch (e) { auth.needPw = true; saveAuth(); setSync('pw', PW_MSG); return; }
    } else if (raw) remote = raw;
    if (remote) remote = Object.assign(emptyState(), remote);
    if (remote) {
      // Während einer Eingabe oder eines offenen Dialogs nicht dazwischenfunken.
      if (!force && uiBusy()) { setSync('ok'); scheduleSync(4000); return; }
      const before = canon(strip(S));
      const keep = { ui: S.ui, showTs: S.settings.showTs, lastBackup: S.lastBackup };
      const merged = mergeState(remote, S);
      merged.ui = keep.ui; merged.settings.showTs = keep.showTs; merged.lastBackup = keep.lastBackup;
      // Den Stand nur austauschen, wenn sich etwas geändert hat – und dann immer neu zeichnen.
      // Sonst arbeitet die angezeigte Tabelle auf dem alten Stand weiter und Eingaben gehen verloren.
      if (canon(strip(merged)) !== before) { const oldName = S.settings.name || ''; S = merged; saveLocal(); if ((S.settings.name || '') !== oldName) greet(); if (!force) render(); else pendingRender = true; }
    }
    if (!remote || (auth.key && !raw.enc) || canon(strip(S)) !== canon(strip(remote))) {
      const plain = JSON.stringify(strip(S));
      step = 'Hochladen';
      auth.etag = (await cloud.upload(token, auth.key ? JSON.stringify(await encryptText(plain)) : plain)).eTag;
      delete auth.overwrite;
    } else auth.etag = meta.eTag;
    if (dirtyGen === gen) auth.dirty = false; else scheduleSync(2500);
    auth.last = nowIso(); saveAuth(); setSync('ok');
  } catch (e) {
    console.error(e);
    if (!navigator.onLine) setSync('offline', 'Keine Verbindung – der Abgleich folgt automatisch.');
    else setSync('error', 'Schritt „' + step + '“: ' + e.message);
  } finally { syncing = false; }
}
let pendingRender = false;

async function syncDialog() {
  const info = h('p', { class: 'hint' });
  const describe = () => {
    if (!auth) info.textContent = 'Nicht angemeldet. Die Daten liegen nur auf diesem Gerät.';
    else if (auth.needLogin || syncState === 'login') info.textContent = 'Die Anmeldung ist abgelaufen. Bitte erneut anmelden; deine Einträge bleiben erhalten.';
    else if (auth.needPw) info.textContent = PW_MSG;
    else if (syncState === 'error') info.textContent = 'Fehler beim Abgleich: ' + syncMsg;
    else if (syncState === 'offline') info.textContent = 'Keine Verbindung. Der Abgleich folgt automatisch, sobald das Gerät wieder online ist.';
    else info.textContent = (auth.last ? 'Angemeldet. Letzter Abgleich: ' + fmtTs(auth.last, true) : 'Angemeldet. Noch kein Abgleich.') +
      (auth.key ? ' Verschlüsselung: aktiv.' : ' Verschlüsselung: aus.');
  };
  describe();
  const body = h('div', {},
    h('p', { class: 'hint' }, 'Das Notenbuch legt seine Daten in einem eigenen Ordner deiner OneDrive ab (Apps/Notenbuch) und gleicht sie auf allen angemeldeten Geräten automatisch ab. Auf andere Dateien hat es keinen Zugriff.'),
    info);
  const actions = [];
  if (!canSync) {
    body.append(h('p', { class: 'hint' }, 'Der Abgleich funktioniert nur unter ' + REDIRECT));
  } else if (!auth || auth.needLogin) {
    actions.push({ label: auth ? 'Erneut anmelden' : 'Mit Microsoft anmelden', primary: true, button: true, fn: async () => { await login(false); return KEEP; } });
  } else if (auth.needPw) {
    actions.push({ label: 'Passwort eingeben', primary: true, button: true, value: 'unlock' });
  } else {
    // Verschlüsselung ist vorbereitet, aber noch nicht freigeschaltet (erst muss der Abgleich stabil laufen).
    if (auth.key) actions.push({ label: 'Passwort ändern', value: 'set' });
    actions.push({ label: 'Jetzt abgleichen', fn: async () => { await sync(true); describe(); return KEEP; } });
  }
  if (auth) actions.unshift({ label: 'Abmelden', cls: 'danger left', value: 'logout' });
  actions.push({ label: 'Sicherung', value: 'backup', modalOnly: true });
  actions.push({ label: 'Schließen', primary: !actions.some(a => a.primary), value: null });
  const r = await dlg('Automatischer Abgleich', body, actions);
  if (r === 'logout') { auth = null; saveAuth(); clearTimeout(syncTimer); setSync('off'); }
  if (r === 'backup') backupDialog();
  if (r === 'unlock' || r === 'set') { await pwDialog(r); return syncDialog(); }
  if (pendingRender) { pendingRender = false; render(); }
}

async function startSync() {
  await handleRedirect();
  if (!auth) { setSync('off'); return; }
  // Die Microsoft-Anmeldung hält bei Web-Apps höchstens 24 Stunden. Beim Öffnen wird sie
  // deshalb einmal still erneuert; gelingt das nicht, bittet die App um eine neue Anmeldung.
  if (canSync && navigator.onLine && !auth.silentFailed && (auth.needLogin || Date.now() > (auth.rexp || 0))) { login(true); return; }
  if (auth.needLogin) { setSync('login', 'Bitte erneut bei Microsoft anmelden.'); return; }
  sync();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', () => sync());
setInterval(() => { if (!document.hidden) sync(); }, 60000);

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline-Modus nicht verfügbar:', e));
}
render();
/* Begrüßung nach Tageszeit. Sie wird beim Öffnen Buchstabe für Buchstabe „geschrieben“
   (Umriss wird nachgezogen, dann gefüllt) und bleibt danach stehen. */
/* Fünf Handschriften wechseln sich ab: bei jedem Öffnen die nächste. */
const GREET_FONTS = [
  { fam: 'NBG1', size: 32 },   // Dancing Script
  { fam: 'NBG2', size: 42 },   // Italianno
  { fam: 'NBG3', size: 48 },   // Herr Von Muellerhoff
  { fam: 'NBG4', size: 23 },   // Homemade Apple
  { fam: 'NBG5', size: 36 }    // Caveat
];
let greetFont = 0;
try {
  greetFont = (+localStorage.getItem('lehrerkalender.greetFont') || 0) % GREET_FONTS.length;
  localStorage.setItem('lehrerkalender.greetFont', String(greetFont + 1));
} catch (e) {}
/* Die Begrüßung wird wie mit einem Stift geschrieben: Eine Maske gibt die Tinte Buchstabe für
   Buchstabe entlang der Buchstabenform frei, in leicht ungleichmäßigem Tempo. Danach bleibt sie stehen. */
async function greet() {
  const hr = new Date().getHours(), name = (S.settings.name || '').trim();
  const base = hr >= 6 && hr < 12 ? 'Guten Morgen' : hr >= 12 && hr < 18 ? 'Guten Nachmittag' : hr >= 18 && hr < 22 ? 'Guten Abend' : 'Es ist Schlafenszeit';
  const text = name ? base + ' ' + name : base;
  const box = document.getElementById('greet');
  box.setAttribute('aria-label', text);
  const F = GREET_FONTS[greetFont], size = F.size, pad = 18, pen = Math.max(4, size * 0.17);
  const run = greet.run = (greet.run || 0) + 1;
  try { await document.fonts.load(size + 'px ' + F.fam, text); } catch (e) {}
  if (run !== greet.run) return;   // ein neuerer Aufruf hat übernommen
  const NS = 'http://www.w3.org/2000/svg', mk = n => document.createElementNS(NS, n);
  const svg = mk('svg'), defs = mk('defs'), mask = mk('mask'), tm = mk('text'), ti = mk('text');
  const y = Math.round(size * 1.2), hgt = Math.round(size * 1.9);
  svg.setAttribute('aria-hidden', 'true');
  mask.id = 'greetmask'; mask.setAttribute('maskUnits', 'userSpaceOnUse');
  for (const t of [tm, ti]) { t.setAttribute('x', pad); t.setAttribute('y', y); t.style.fontFamily = F.fam + ', cursive'; t.style.fontSize = size + 'px'; }
  ti.setAttribute('class', 'ink'); ti.setAttribute('mask', 'url(#greetmask)');
  const chars = [...text], strokes = [];
  for (const ch of chars) {
    const a = mk('tspan'), b = mk('tspan');
    a.textContent = b.textContent = ch;
    a.style.strokeWidth = pen + 'px';
    tm.append(a); ti.append(b); strokes.push(a);
  }
  mask.append(tm); defs.append(mask); svg.append(defs, ti);
  box.replaceChildren(svg);
  const w = Math.ceil(ti.getComputedTextLength()) + pad * 2;
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
  svg.setAttribute('width', w); svg.setAttribute('height', hgt);
  mask.setAttribute('x', 0); mask.setAttribute('y', 0); mask.setAttribute('width', w); mask.setAttribute('height', hgt);
  let at = 1.1;   // erst schreiben, wenn der Hintergrund steht (läuft auf dem iPhone flüssiger)
  chars.forEach((ch, i) => {
    if (ch === ' ') { at += 0.18; return; }
    let len = 220;
    try { const r = ti.getExtentOfChar(i); len = Math.max(50, 3.2 * (r.width + r.height)); } catch (e) {}
    const dur = Math.min(0.5, Math.max(0.16, len / 520)) * (0.9 + Math.random() * 0.25);
    const a = strokes[i];
    a.style.strokeDasharray = len; a.style.strokeDashoffset = len;
    a.style.animation = 'penstroke ' + dur.toFixed(2) + 's ease-in-out ' + at.toFixed(2) + 's forwards, penfill .22s linear ' + (at + dur * 0.85).toFixed(2) + 's forwards';
    at += dur * 0.6;
  });
  // Farbige Tinte der Jahreszeit, am Ende ein paar Spritzer.
  box.style.color = SEASON.ink;
  for (let i = 0; i < 9; i++) {
    const c = mk('circle'), right = i % 3 !== 0;
    c.setAttribute('cx', right ? w - pad + 4 + Math.random() * 24 : pad - 6 - Math.random() * 14);
    c.setAttribute('cy', y - size * 0.9 + Math.random() * size * 1.3);
    c.setAttribute('r', (0.8 + Math.random() * 2.4).toFixed(1)); c.setAttribute('fill', 'currentColor'); c.setAttribute('class', 'dot');
    c.style.animationDelay = (at + 0.3 + i * 0.05).toFixed(2) + 's';
    svg.append(c);
  }
}
/* Der Name gehört zum Nutzer: Er liegt in den Einstellungen, wird mit dessen OneDrive abgeglichen
   und steht nicht im Code. Antippen der Begrüßung ändert ihn. */
async function editName() {
  const inp = h('input', { type: 'text', value: S.settings.name || '', autocomplete: 'off', autocapitalize: 'words', maxlength: 30 });
  const r = await dlg('Begrüßung', field('Dein Vorname (leer lassen für keine Anrede)', inp), [
    { label: 'Abbrechen', value: null },
    { label: 'Übernehmen', primary: true, fn: () => ({ name: inp.value.trim() }) }
  ]);
  if (!r) return;
  S.settings.name = r.name; S.settings.m = nowIso(); save(); greet();
}
/* ---------- Jahreszeit ----------
   Der obere Bereich bekommt je nach Jahreszeit ein dezentes Aquarell und kleine Motive,
   die wie von Kinderhand gemalt aussehen. Zum Ansehen: ?jahreszeit=fruehling|sommer|herbst|winter */
const SEASONS = {
  fruehling: { wash: ['#f9dfe3', '#f1b3bd', '#bfe3d6', '#e3f3ec'], ink: '#a02c58', kind: 'flower', cols: ['#ef9fb0', '#c9b6ee', '#f6d778', '#f5bd98'] },
  sommer: { wash: ['#fcefc4', '#f6d778', '#9fd6c6', '#d5ede6'], ink: '#0e6b5a', kind: 'blob', cols: ['#f6d778', '#f5a37a', '#8fd0bd', '#ef9fb0', '#9cc4ee'] },
  herbst: { wash: ['#fcefc4', '#f3cf6b', '#f1b08a', '#fbe3d2'], ink: '#a3481a', kind: 'leaf', cols: ['#eec23f', '#e8973a', '#d9772b', '#c9a227'] },
  winter: { wash: ['#e4eefa', '#bcd6f0', '#cfc6ee', '#ece8f8'], ink: '#2f4f8f', kind: 'snow', cols: ['#9fc3e6', '#b9a8e6', '#86b4dd'] }
};
const SEASON = (() => {
  const q = new URLSearchParams(location.search).get('jahreszeit');
  if (SEASONS[q]) return SEASONS[q];
  const m = new Date().getMonth() + 1;
  return SEASONS[m >= 3 && m <= 5 ? 'fruehling' : m >= 6 && m <= 8 ? 'sommer' : m >= 9 && m <= 11 ? 'herbst' : 'winter'];
})();
function doodle(kind, col) {
  const r = Math.random;
  if (kind === 'flower') {
    let s = '';
    for (let k = 0; k < 5; k++) {
      const a = k * 72 * Math.PI / 180 + r() * 0.25, d = 5 + r() * 1.2;
      s += '<circle cx="' + (Math.cos(a) * d).toFixed(1) + '" cy="' + (Math.sin(a) * d).toFixed(1) + '" r="' + (3.6 + r() * 1.2).toFixed(1) + '" fill="' + col + '"/>';
    }
    return s + '<circle r="2.8" fill="' + (col === '#f6d778' ? '#f5a37a' : '#f6d778') + '"/>';
  }
  if (kind === 'leaf') {
    return '<path d="M0 -10 C7.5 -6 7 5 0 10 C-7 5 -7.5 -6 0 -10Z" fill="' + col + '"/>' +
      '<path d="M0 -7 L0 13 M0 -1 L4 -4 M0 3 L-4 0" stroke="#8a5a1c" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".7"/>';
  }
  if (kind === 'snow') {
    if (r() < 0.45) return '<circle r="' + (3 + r() * 2.5).toFixed(1) + '" fill="#fff" stroke="' + col + '" stroke-width="1.6"/>';
    return '<path d="M0 -9 L0 9 M-7.8 -4.5 L7.8 4.5 M-7.8 4.5 L7.8 -4.5 M-2.5 -6.5 L0 -4.5 L2.5 -6.5 M-2.5 6.5 L0 4.5 L2.5 6.5" stroke="' + col + '" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  if (r() < 0.2) return '<circle r="4.5" fill="#f6d778"/><path d="M0 -9 L0 -6.5 M0 9 L0 6.5 M-9 0 L-6.5 0 M9 0 L6.5 0 M-6.4 -6.4 L-4.7 -4.7 M6.4 6.4 L4.7 4.7 M-6.4 6.4 L-4.7 4.7 M6.4 -6.4 L4.7 -4.7" stroke="#f0b93a" stroke-width="1.7" stroke-linecap="round"/>';
  return '<path d="M-8 -3 C-9 -10 4 -11 8 -5 C12 1 7 9 0 9 C-7 10 -8 3 -8 -3Z" fill="' + col + '"/>';
}
function paintSeason() {
  const box = document.getElementById('season'), W = box.clientWidth || innerWidth, H = 440, r = Math.random;
  const wash = h('div', { class: 'wash' });
  const w = SEASON.wash;
  wash.style.background = 'linear-gradient(100deg, ' + w[0] + ' 0%, ' + w[1] + ' 30%, ' + w[2] + ' 64%, ' + w[3] + ' 100%)';
  let s = '';
  for (let i = 0, n = Math.round(W / 52); i < n; i++) {
    const x = r() * W, y = 10 + Math.pow(r(), 1.5) * 310, size = 15 + r() * 18;
    const o = Math.max(0.1, 0.55 * (1 - y / 340));
    s += '<g transform="translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ') rotate(' + (r() * 360).toFixed(0) + ') scale(' + (size / 20).toFixed(2) + ')">' +
      '<g class="dd" style="--o:' + o.toFixed(2) + ';animation-delay:' + (0.15 + r() * 0.7).toFixed(2) + 's">' + doodle(SEASON.kind, SEASON.cols[i % SEASON.cols.length]) + '</g></g>';
  }
  const holder = h('div', {});
  holder.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMin slice">' + s + '</svg>';
  box.replaceChildren(wash, holder.firstChild);
  paintSeason.w = W;
}
paintSeason();
addEventListener('resize', () => { if (Math.abs((document.getElementById('season').clientWidth || 0) - paintSeason.w) > 80) paintSeason(); });
document.getElementById('greet').addEventListener('click', editName);
greet();
startSync();
