<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notenbuch">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202328" media="(prefers-color-scheme: dark)">
<title>Lehrerkalender – Notenbuch</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f3; --panel: #ffffff; --ink: #1d2422; --muted: #6b716e; --line: #e9e3da; --head: #f7f3ed;
  --accent: #0e3c35; --accent-ink: #ffffff; --soft: #e8ede6; --bad: #b3261e; --good: #2f8f63;
  --p1: #f6d6da; --p2: #fbe9b7; --p3: #ded8f1; --p4: #cfe7e0; --p5: #f9ddc8;
  --g-good-bg: #e3f6e6; --g-good: #1c6b2e; --g-mid-bg: #fff2d1; --g-mid: #7a5200; --g-low-bg: #fde4df; --g-low: #a3261b;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 6px 20px rgba(60, 45, 20, .07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181b; --panel: #202328; --ink: #eceae5; --muted: #a3a1aa; --line: #363a41; --head: #262a30;
    --accent: #9fd4c4; --accent-ink: #0c2622; --soft: #24362f; --bad: #ff8a80; --good: #58c88a;
    --p1: #4d3237; --p2: #4b4226; --p3: #393452; --p4: #27463f; --p5: #4d3929;
    --g-good-bg: #1d3a26; --g-good: #9be3ad; --g-mid-bg: #40351a; --g-mid: #f3d58a; --g-low-bg: #45231f; --g-low: #ffaea5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
header.top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  background: var(--panel); color: var(--accent); border-bottom: 1px solid var(--line);
}
header.top h1 { font-size: 21px; font-weight: 600; letter-spacing: .3px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top h1::before { content: "📒"; margin-right: 8px; }
header.top button { background: var(--soft); border-color: transparent; color: var(--accent); border-radius: 999px; padding: 7px 14px; }
header.top button:hover { border-color: var(--accent); }
#btnSync::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #b9b4aa; vertical-align: 1px; }
#btnSync[data-state=ok]::before { background: #35a868; }
#btnSync[data-state=busy]::before { background: #e0a100; }
#btnSync[data-state=error]::before, #btnSync[data-state=login]::before, #btnSync[data-state=pw]::before, #btnSync[data-state=offline]::before { background: #d9493d; }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { #status { display: none; } header.top { gap: 8px; } header.top h1 { font-size: 18px; } header.top button { padding: 6px 10px; font-size: 14px; } }

button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, box-shadow .15s, transform .05s;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; box-shadow: 0 2px 6px rgba(14, 60, 53, .22); }
button.danger { color: var(--bad); }
button.danger:hover { border-color: var(--bad); }
button.small { padding: 5px 10px; font-size: 13px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; width: 100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border-radius: 999px; padding: 9px 18px; color: var(--muted); background: var(--panel); font-weight: 600; flex: none; }
.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 2px 8px rgba(14, 60, 53, .22); }
.tabs button.add { border-style: dashed; background: transparent; font-weight: 400; }
#classTabs button:not(.add) { color: var(--ink); border-color: transparent; background: var(--p1); }
#classTabs button:not(.add):nth-child(5n+2) { background: var(--p2); }
#classTabs button:not(.add):nth-child(5n+3) { background: var(--p3); }
#classTabs button:not(.add):nth-child(5n+4) { background: var(--p4); }
#classTabs button:not(.add):nth-child(5n+5) { background: var(--p5); }
#classTabs button.active { box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
#classTabs button:not(.active):not(.add) { opacity: .75; }
.namebtn { border: none; background: transparent; padding: 4px 6px; margin: -4px -6px; text-align: left; font: inherit; font-weight: 500; white-space: normal; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }
.namebtn:hover { background: var(--soft); }
.nbadge { background: var(--p2); color: var(--ink); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.notes { list-style: none; margin: 14px 0 0; padding: 0; max-height: 38vh; overflow-y: auto; }
.notes li { background: var(--head); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
.notes li .tx { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes li .tx small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
dialog.dlg textarea.notein { min-height: 110px; }
.dictrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
button.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.tabs.sub { padding: 10px 16px 12px; }
.tabs.sub button { font-size: 14px; padding: 6px 14px; font-weight: 500; }
.tabs.sub button.active { background: var(--soft); border-color: var(--accent); color: var(--ink); font-weight: 600; box-shadow: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); margin: 0 12px 24px; padding: 6px 16px 20px; min-height: 55vh; }
@media (max-width: 560px) { .panel { margin: 0 8px 16px; padding: 4px 12px 16px; border-radius: 16px; } .tabs, .tabs.sub { padding-left: 10px; padding-right: 10px; } }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; }
.bar .grow { flex: 1; }
.bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty::before { content: "📚"; display: block; font-size: 46px; margin-bottom: 8px; }
.empty button { margin-top: 12px; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: center; vertical-align: middle; }
tr:last-child > td { border-bottom: none; }
thead th { background: var(--head); font-size: 13px; font-weight: 600; border-bottom: 2px solid var(--line); }
tbody tr:hover > td { background: var(--head); }
tfoot td { background: var(--head); font-size: 13px; color: var(--muted); border-top: 2px solid var(--line); }
th.name, td.name { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 150px; max-width: 220px; background: var(--panel); border-right: 1px solid var(--line); font-weight: 500; }
thead th.name, tfoot td.name { background: var(--head); }
th .colbtn { border: none; background: transparent; padding: 3px 6px; font-weight: 600; display: block; width: 100%; border-radius: 8px; }
th .colbtn:hover { background: var(--soft); }
th .colbtn small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
td.cell { min-width: 84px; }
td.cell input.grade { width: 56px; text-align: center; padding: 6px 4px; font-weight: 700; border-radius: 10px; }
td.cell input.grade[data-g="1"], td.cell input.grade[data-g="2"] { background: var(--g-good-bg); color: var(--g-good); border-color: transparent; }
td.cell input.grade[data-g="3"], td.cell input.grade[data-g="4"] { background: var(--g-mid-bg); color: var(--g-mid); border-color: transparent; }
td.cell input.grade[data-g="5"], td.cell input.grade[data-g="6"] { background: var(--g-low-bg); color: var(--g-low); border-color: transparent; }
td.cell textarea.txt { display: block; min-width: 220px; min-height: 0; resize: none; overflow: hidden; text-align: left; line-height: 1.35; }
td.cell input.bad { border-color: var(--bad); color: var(--bad); background: var(--panel); }
td.cell .ts { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; min-height: 13px; white-space: nowrap; }
.hide-ts .ts { display: none; }
td.avg { font-variant-numeric: tabular-nums; min-width: 64px; }
td.calc { color: var(--muted); }
th.calc, th.final { min-width: 84px; }
th small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
th.final, td.note, tbody tr:hover > td.note { background: var(--soft); }
td.note { font-weight: 700; font-size: 18px; min-width: 56px; color: var(--accent); }
.seg { display: inline-flex; background: var(--head); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: none; background: transparent; border-radius: 999px; padding: 6px 14px; color: var(--muted); }
.seg button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.check { width: 46px; height: 38px; padding: 0; font-size: 18px; border-radius: 12px; }
button.check.on { background: var(--good); border-color: var(--good); color: #fff; }

ul.students { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
ul.students li { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
ul.students li:hover { background: var(--head); }
ul.students li:last-child { border-bottom: none; }
ul.students li .nr { color: var(--accent); background: var(--soft); min-width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
ul.students li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }

dialog.dlg { border: none; border-radius: 20px; background: var(--panel); color: var(--ink); padding: 22px; width: min(520px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog.dlg::backdrop { background: rgba(30, 25, 15, .45); }
dialog.dlg h2 { margin: 0 0 14px; font-size: 19px; }
dialog.dlg .field { display: block; margin-bottom: 12px; }
dialog.dlg .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
dialog.dlg textarea { min-height: 180px; resize: vertical; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.dlg-actions .left { margin-right: auto; }
.catrow { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; margin-bottom: 8px; align-items: center; }
</style>
</head>
<body>
<header class="top">
  <h1>Notenbuch</h1>
  <span id="status"></span>
  <button id="btnSync">Abgleich aus</button>
  <button id="btnBackup">Sicherung</button>
</header>
<nav class="tabs" id="classTabs"></nav>
<main id="main"></main>

<script>
'use strict';
const KEY = 'lehrerkalender.v1';
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

/* ---------- Daten ---------- */
function emptyState() {
  return { version: 2, classes: [], deleted: {}, settings: { tendency: 0.25, showTs: true }, ui: { classId: null, tabId: 'students' }, lastBackup: null };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(emptyState(), JSON.parse(raw));
  } catch (e) { console.error(e); }
  return emptyState();
}
let S = load();
function save() { saveLocal(); markDirty(); }
function saveLocal() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    setStatus('Gespeichert ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setStatus('Speichern fehlgeschlagen!');
    alert('Die Daten konnten nicht gespeichert werden: ' + e.message);
  }
}
function setStatus(t) { document.getElementById('status').textContent = t; }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
const curClass = () => S.classes.find(c => c.id === S.ui.classId) || null;
const nowIso = () => new Date().toISOString();
const markDeleted = id => { S.deleted[id] = nowIso(); };

/* Zellen: gelöschte Einträge bleiben als { v: null } mit Zeitstempel erhalten,
   damit eine Löschung beim Zusammenführen nicht wieder auftaucht. */
function getCell(tab, sid, colId) {
  const c = (tab.cells[sid] || {})[colId];
  return c && c.v != null ? c : null;
}
function setCell(tab, sid, colId, v) {
  const cells = tab.cells[sid] || (tab.cells[sid] = {});
  const c = cells[colId], n = nowIso();
  if (v == null || v === '') { if (c && c.v != null) cells[colId] = { v: null, t: c.t, m: n }; }
  else if (!c || c.v == null) cells[colId] = { v, t: n, m: n };
  else if (c.v !== v) { c.v = v; c.m = n; }
  return getCell(tab, sid, colId);
}

/* ---------- Zusammenführen zweier Stände ---------- */
function newer(a, b) { return (b.m || '') > (a.m || '') ? b : a; }
function mergeList(a, b, deleted, mergeItem) {
  const bm = new Map(b.map(x => [x.id, x])), seen = new Set(), out = [];
  for (const x of a) {
    seen.add(x.id);
    if (deleted[x.id]) continue;
    const y = bm.get(x.id);
    out.push(y ? mergeItem(x, y) : x);
  }
  for (const y of b) if (!seen.has(y.id) && !deleted[y.id]) out.push(y);
  return out;
}
function mergeTab(a, b, deleted) {
  const top = newer(a, b);
  const t = { id: a.id, type: a.type, name: top.name, m: top.m, columns: mergeList(a.columns, b.columns, deleted, newer), cells: {} };
  if (a.type === 'grades') {
    const src = (b.catM || '') > (a.catM || '') ? b : a;
    t.categories = src.categories; t.catM = src.catM;
    const ids = new Set(t.categories.map(c => c.id));
    t.columns.forEach(col => { if (!ids.has(col.catId)) col.catId = t.categories[0].id; });
  }
  for (const sid of new Set([...Object.keys(a.cells), ...Object.keys(b.cells)])) {
    if (deleted[sid]) continue;
    const ca = a.cells[sid] || {}, cb = b.cells[sid] || {}, out = {};
    for (const cid of new Set([...Object.keys(ca), ...Object.keys(cb)])) {
      if (deleted[cid]) continue;
      out[cid] = ca[cid] && cb[cid] ? newer(ca[cid], cb[cid]) : (ca[cid] || cb[cid]);
    }
    t.cells[sid] = out;
  }
  return t;
}
function mergeState(a, b) {
  const deleted = { ...(b.deleted || {}), ...(a.deleted || {}) };
  // Schüler: Name vom neueren Stand, Notizen von beiden Seiten zusammengeführt.
  const mergeStudent = (x, y) => {
    const out = { ...newer(x, y) };
    const notes = mergeList(x.notes || [], y.notes || [], deleted, newer)
      .sort((p, q) => (p.t || '').localeCompare(q.t || '') || p.id.localeCompare(q.id));
    if (notes.length) out.notes = notes; else delete out.notes;
    return out;
  };
  const out = Object.assign(emptyState(), a, { deleted });
  out.classes = mergeList(a.classes, b.classes || [], deleted, (x, y) => {
    const top = newer(x, y);
    // Reihenfolge der Schüler: Es gilt die Seite, auf der zuletzt sortiert wurde.
    const yFirst = (y.orderM || '') > (x.orderM || '');
    return { id: x.id, name: top.name, m: top.m, orderM: yFirst ? y.orderM : x.orderM,
      students: yFirst ? mergeList(y.students, x.students, deleted, mergeStudent) : mergeList(x.students, y.students, deleted, mergeStudent),
      tabs: mergeList(x.tabs, y.tabs, deleted, (p, q) => mergeTab(p, q, deleted)) };
  });
  const sNew = newer(a.settings || {}, b.settings || {});
  out.settings = { ...a.settings, m: sNew.m };
  if (sNew.tendency != null) out.settings.tendency = sNew.tendency;
  if ((b.lastBackup || '') > (a.lastBackup || '')) out.lastBackup = b.lastBackup;
  return out;
}

/* ---------- Hilfen ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked') e.checked = true;
    else e.setAttribute(k, v === true ? '' : v);
  }
  return e;
}
const fmtNum = n => n.toFixed(2).replace('.', ',');
function fmtTs(iso, long) {
  const d = new Date(iso);
  return long
    ? d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    : d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function tsTitle(c) {
  if (!c) return '';
  return 'Eingetragen: ' + fmtTs(c.t, true) + (c.m !== c.t ? '\nGeändert: ' + fmtTs(c.m, true) : '');
}
function tsText(c) {
  if (!c) return '';
  return fmtTs(c.m) + (c.m !== c.t ? ' ✎' : '');
}

/* ---------- Dialoge ---------- */
const KEEP = Symbol('keep');
function dlg(title, content, actions) {
  return new Promise(resolve => {
    const d = h('dialog', { class: 'dlg' });
    const close = v => { d.close(); d.remove(); resolve(v); };
    const run = async a => { const v = a.fn ? await a.fn() : a.value; if (v !== KEEP) close(v); };
    const form = h('form', { onsubmit: e => { e.preventDefault(); const a = actions.find(a => a.primary); if (a) run(a); } },
      h('h2', {}, title), content,
      h('div', { class: 'dlg-actions' }, actions.map(a =>
        h('button', { type: a.primary ? 'submit' : 'button', class: a.cls || (a.primary ? 'primary' : ''), onclick: a.primary ? null : () => run(a) }, a.label))));
    d.append(form);
    d.addEventListener('cancel', e => { e.preventDefault(); close(null); });
    document.body.append(d);
    d.showModal();
    const f = d.querySelector('input[type=text], input[type=password], textarea');
    if (f) { f.focus(); f.select(); }
  });
}
function field(label, input) { return h('label', { class: 'field' }, h('span', {}, label), input); }
function askText(title, label, value, okLabel) {
  const inp = h('input', { type: 'text', value: value || '' });
  return dlg(title, field(label, inp), [
    { label: 'Abbrechen', value: null },
    { label: okLabel || 'OK', primary: true, fn: () => inp.value.trim() || KEEP }
  ]);
}
function confirmDlg(title, text, okLabel) {
  return dlg(title, h('p', {}, text), [
    { label: 'Abbrechen', value: false },
    { label: okLabel || 'Löschen', cls: 'danger', value: true }
  ]);
}

/* ---------- Noten ---------- */
const GRADE_RE = /^[1-6][+-]?$/;
function gradeVal(v) {
  let n = +v[0];
  const t = S.settings.tendency;
  if (v[1] === '+') n -= t;
  if (v[1] === '-') n += t;
  return n;
}
/* Halbjahre: Jede Leistung gehört zu Halbjahr 1 oder 2 (ohne Angabe: 1).
   Zeugnisnote eines Halbjahrs = gewichtetes Mittel der Bereichsdurchschnitte
   (Standard: Allgemeine Leistungen und Klassenarbeiten je zur Hälfte).
   Jahresnote: je Bereich (1. Halbjahr × 1 + 2. Halbjahr × 2) ÷ 3, danach das Mittel der Bereiche.
   Gerechnet wird durchgehend mit ungerundeten Werten. */
const HALF_WEIGHT = { 1: 1, 2: 2 };
const colHalf = col => col.half === 2 ? 2 : 1;
function catAvg(tab, sid, catId, half) {
  let s = 0, f = 0;
  for (const col of tab.columns) {
    if (col.catId !== catId || colHalf(col) !== half) continue;
    const c = getCell(tab, sid, col.id);
    if (c) { s += gradeVal(c.v) * col.factor; f += col.factor; }
  }
  return f > 0 ? s / f : null;
}
function catYear(tab, sid, catId) {
  const a = catAvg(tab, sid, catId, 1), b = catAvg(tab, sid, catId, 2);
  if (a == null) return b;
  if (b == null) return a;
  return (a * HALF_WEIGHT[1] + b * HALF_WEIGHT[2]) / (HALF_WEIGHT[1] + HALF_WEIGHT[2]);
}
/* view: 1, 2 (Halbjahr) oder 'J' (Jahr) */
function calcStudent(tab, sid, view) {
  let sum = 0, wsum = 0;
  for (const cat of tab.categories) {
    const v = view === 'J' ? catYear(tab, sid, cat.id) : catAvg(tab, sid, cat.id, view);
    if (v != null && cat.weight > 0) { sum += v * cat.weight; wsum += cat.weight; }
  }
  return wsum > 0 ? sum / wsum : null;
}
/* Berechnete Spalten je Ansicht; dieselbe Liste dient Tabelle und CSV-Export. */
function calcColumns(tab, view) {
  const defs = [];
  if (view === 'J') {
    for (const cat of tab.categories) {
      defs.push({ label: cat.name, sub: '1. Halbjahr', get: sid => catAvg(tab, sid, cat.id, 1) });
      defs.push({ label: cat.name, sub: '2. Halbjahr', get: sid => catAvg(tab, sid, cat.id, 2) });
      defs.push({ label: cat.name, sub: 'Jahr', get: sid => catYear(tab, sid, cat.id) });
    }
    defs.push({ label: 'Zeugnisnote', sub: '1. Halbjahr', get: sid => calcStudent(tab, sid, 1) });
    defs.push({ label: 'Zeugnisnote', sub: '2. Halbjahr', get: sid => calcStudent(tab, sid, 2) });
    defs.push({ label: 'Jahresnote', sub: '', final: true, get: sid => calcStudent(tab, sid, 'J') });
  } else {
    for (const cat of tab.categories) defs.push({ label: 'Ø ' + cat.name, sub: '', get: sid => catAvg(tab, sid, cat.id, view) });
    defs.push({ label: 'Zeugnisnote', sub: view + '. Halbjahr', final: true, get: sid => calcStudent(tab, sid, view) });
  }
  return defs;
}
const meanOf = list => { const v = list.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const fmtOpt = v => v == null ? '–' : fmtNum(v);
function colAvg(tab, col, students) {
  let s = 0, n = 0;
  for (const st of students) { const c = getCell(tab, st.id, col.id); if (c) { s += gradeVal(c.v); n++; } }
  return n ? s / n : null;
}

async function studentNotes(st) {

    const text = ta.value.trim(); if (!text) return false;

    const mic = h('button', { type: 'button' }, '🎤 Diktieren');
    mic.addEventListener('click', () => {
      if (rec) { stop(); return; }
      const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
      try {
        rec = new SR(); rec.lang = 'de-DE'; rec.continuous = true; rec.interimResults = true;
        rec.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript; ta.value = base + s; };
        rec.onerror = e => { msg.textContent = e.error === 'not-allowed' ? 'Mikrofon nicht freigegeben. Bitte erlauben oder die Mikrofon-Taste der Tastatur nutzen.' : 'Diktieren ist hier nicht möglich – bitte die Mikrofon-Taste der Tastatur nutzen.'; };
        rec.onend = () => { rec = null; mic.textContent = '🎤 Diktieren'; mic.classList.remove('rec'); };
        rec.start(); mic.textContent = '■ Stopp'; mic.classList.add('rec'); msg.textContent = 'Ich höre zu …';
      } catch (e) { rec = null; msg.textContent = 'Diktieren ist hier nicht möglich – bitte die Mikrofon-Taste der Tastatur nutzen.'; }
    });
    row.append(mic);

  row.append(msg);
  await dlg('Notizen: ' + st.name, h('div', {}, ta, row, list), [
    { label: 'Schließen', value: null },

  ]);

  render();
}

/* ---------- Import ---------- */
function namesFromRows(rows) {
  rows = rows.map(r => r.map(c => String(c == null ? '' : c).trim())).filter(r => r.some(c => c));
  if (!rows.length) return [];
  const head = rows[0].map(c => c.toLowerCase());
  const iN = head.findIndex(c => /^(nachname|familienname|name)$/.test(c));
  const iV = head.findIndex(c => /^(vorname|rufname)$/.test(c));
  if (iN >= 0 || iV >= 0) {
    return rows.slice(1).map(r => [iN >= 0 ? r[iN] : '', iV >= 0 ? r[iV] : ''].filter(Boolean).join(', ')).filter(Boolean);
  }
  return rows.map(r => r.filter(c => c && !/^\d+[.)]?$/.test(c)).slice(0, 2).join(', ')).filter(Boolean);
}
function rowsFromText(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  const delim = text.includes(';') ? ';' : text.includes('\t') ? '\t' : ',';
  return lines.map(l => l.split(delim).map(c => c.trim().replace(/^"(.*)"$/, '$1')));
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Laden fehlgeschlagen'));
    document.head.append(s);
  });
}
async function namesFromFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.(xlsx|xls|ods)$/i.test(file.name)) {
    if (!window.XLSX) {
      try { await loadScript(XLSX_URL); }
      catch (e) { throw new Error('Für Excel-Dateien wird einmalig eine Internetverbindung benötigt. Alternativ die Liste als CSV speichern oder die Namen einfügen.'); }
    }
    const wb = XLSX.read(buf, { type: 'array' });
    return namesFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }));
  }
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
  return namesFromRows(rowsFromText(text));
}
async function importStudents(cls) {
  const ta = h('textarea', { placeholder: 'Ein Name pro Zeile, z. B.\nMüller, Anna\nSchmidt, Ben' });
  const msg = h('p', { class: 'hint' }, 'Datei wählen oder Namen einfügen. Die Liste kann vor dem Import bearbeitet werden.');
  const file = h('input', { type: 'file', accept: '.csv,.txt,.xlsx,.xls,.ods', onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const names = await namesFromFile(f);
      ta.value = names.join('\n');
      msg.textContent = names.length + ' Namen aus „' + f.name + '“ gelesen. Bitte prüfen.';
    } catch (err) { msg.textContent = err.message; }
  } });
  const ok = await dlg('Namensliste importieren – ' + cls.name, h('div', {}, field('Datei (CSV oder Excel)', file), field('Namen', ta), msg), [
    { label: 'Abbrechen', value: null },
    { label: 'Importieren', primary: true, value: true }
  ]);
  if (!ok) return;
  const have = new Set(cls.students.map(s => s.name.toLowerCase()));
  let n = 0;
  for (const line of ta.value.split(/\r?\n/)) {
    const name = line.trim();
    if (!name || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    cls.students.push({ id: uid(), name, m: nowIso() }); n++;
  }
  save(); render();
  setStatus(n + ' Schüler importiert');
}

async function tokenRequest(params) {

  if (q.has('error')) {
    if (pk.silent) { if (auth) { auth.needLogin = true; auth.silentFailed = true; saveAuth(); } }
    else if (q.get('error') !== 'access_denied') alert('Anmeldung fehlgeschlagen: ' + (q.get('error_description') || q.get('error')));

  if (!pk.verifier || pk.state !== q.get('state')) { alert('Die Anmeldung konnte nicht zugeordnet werden. Bitte erneut versuchen.'); return; }

    storeTokens(await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: pk.verifier }), true);

  if (!auth || auth.needLogin) return null;

async function httpError(r) {

  return JSON.parse(t.slice(WRAP.length + 1, -2));
}
function loadByScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    let finished = false;
    const done = (err, value) => {
      if (finished) return;
      finished = true; clearTimeout(timer); delete window[WRAP]; s.remove();
      if (err) reject(err); else resolve(value);
    };
    const timer = setTimeout(() => done(new Error('Zeitüberschreitung')), 20000);
    window[WRAP] = value => done(null, value);
    s.onerror = () => done(new Error('Skript wurde nicht geladen'));
    s.onload = () => setTimeout(() => done(new Error('Skript ohne Daten')), 0);
    s.src = url;
    document.head.append(s);
  });

const cloud = {

    const url = meta['@microsoft.graph.downloadUrl'] || meta['@content.downloadUrl'];

    auth.key = key; auth.salt = raw.salt;
  }
  delete auth.needPw; auth.dirty = true; saveAuth();
  return true;
}
/* Passwort neu festlegen. mergeFirst: vorher den Stand aus der OneDrive einarbeiten. */
async function setPassword(pw, mergeFirst) {
  if (mergeFirst) {
    await sync(true);
    if (syncState !== 'ok') throw new Error(syncMsg || 'Der Abgleich ist gerade nicht möglich.');
  }
  auth.salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  auth.key = await deriveKey(pw, auth.salt);
  delete auth.needPw; auth.overwrite = true; auth.dirty = true; saveAuth();
  await sync(true);
  if (syncState !== 'ok') throw new Error(syncMsg || 'Der Abgleich ist gerade nicht möglich.');
}
async function pwDialog(mode) {
  const p1 = h('input', { type: 'password', autocomplete: mode === 'unlock' ? 'current-password' : 'new-password' });
  const p2 = h('input', { type: 'password', autocomplete: 'new-password' });
  const msg = h('p', { class: 'hint' });
  const texts = {
    unlock: 'Die Daten in der OneDrive sind verschlüsselt. Gib das Passwort ein, das du auf dem ersten Gerät festgelegt hast.',
    set: 'Mit dem Passwort wird die Datei in der OneDrive verschlüsselt. Auf jedem weiteren Gerät gibst du es einmal ein. Mindestens 8 Zeichen. Es wird nirgends hinterlegt und kann nicht wiederhergestellt werden.',
    reset: 'Neues Passwort festlegen. Die Datei in der OneDrive wird mit dem Stand dieses Geräts neu geschrieben. Andere Geräte fragen danach nach dem neuen Passwort und bringen ihre Einträge wieder ein.'
  };
  const body = h('div', {}, h('p', { class: 'hint' }, texts[mode]), field('Passwort', p1), mode === 'unlock' ? null : field('Passwort wiederholen', p2), msg);
  const actions = [{ label: 'Abbrechen', value: null }];
  if (mode === 'unlock') actions.unshift({ label: 'Passwort vergessen', cls: 'danger left', value: 'reset' });
  actions.push({ label: mode === 'unlock' ? 'Entsperren' : 'Festlegen', primary: true, fn: async () => {
    try {
      if (mode === 'unlock') {
        msg.textContent = 'Prüfe …';
        if (!await unlock(p1.value)) { msg.textContent = 'Das Passwort passt nicht.'; return KEEP; }
        await sync(true);
      } else {
        if (p1.value.length < 8) { msg.textContent = 'Bitte mindestens 8 Zeichen.'; return KEEP; }
        if (p1.value !== p2.value) { msg.textContent = 'Die beiden Eingaben stimmen nicht überein.'; return KEEP; }
        msg.textContent = 'Verschlüssele …';
        await setPassword(p1.value, mode === 'set');
      }
      return true;
    } catch (e) { msg.textContent = 'Fehler: ' + e.message; return KEEP; }
  } });
  const r = await dlg(mode === 'unlock' ? 'Passwort eingeben' : 'Passwort festlegen', body, actions);
  if (r === 'reset') return pwDialog('reset');
  return r;
}

/* Nur diese Teile werden abgeglichen; Ansicht und Geräte-Einstellungen bleiben lokal. */
function strip(s) {
  return { version: s.version, classes: s.classes, deleted: s.deleted || {}, settings: { tendency: s.settings.tendency, m: s.settings.m } };
}
function canon(v) {
  return JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
    ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
}
const uiBusy = () => !!document.querySelector('dialog[open]') ||
  /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
function scheduleSync(ms) { if (!auth) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), ms); }

async function sync(force) {
  if (!auth || syncing) return;
  if (!navigator.onLine) { setSync('offline', 'Keine Verbindung – der Abgleich folgt automatisch.'); return; }
  syncing = true; setSync('busy');
  let step = 'Anmeldung prüfen';
  try {
    const token = await getToken();
    if (!token) { setSync('login', 'Bitte erneut bei Microsoft anmelden.'); return; }
    if (auth.needPw && !auth.overwrite) { setSync('pw', PW_MSG); return; }
    const gen = dirtyGen;
    step = 'Dateiinfo abrufen';
    const meta = await cloud.meta(token);
    if (meta && !force && !auth.dirty && meta.eTag === auth.etag) { auth.last = nowIso(); saveAuth(); setSync('ok'); return; }
    step = 'Herunterladen';
    const raw = meta && !auth.overwrite ? await cloud.download(meta, token) : null;
    step = 'Zusammenführen';
    let remote = null;
    if (raw && raw.enc) {
      try {
        if (!auth.key || auth.salt !== raw.salt) throw new Error('Schlüssel fehlt');
        remote = await decryptRaw(raw, auth.key);
      } catch (e) { auth.needPw = true; saveAuth(); setSync('pw', PW_MSG); return; }
    } else if (raw) remote = raw;
    if (remote) remote = Object.assign(emptyState(), remote);
    if (remote) {
      // Während einer Eingabe oder eines offenen Dialogs nicht dazwischenfunken.
      if (!force && uiBusy()) { setSync('ok'); scheduleSync(4000); return; }
      const before = canon(strip(S));
      const keep = { ui: S.ui, showTs: S.settings.showTs, lastBackup: S.lastBackup };
      const merged = mergeState(remote, S);
      merged.ui = keep.ui; merged.settings.showTs = keep.showTs; merged.lastBackup = keep.lastBackup;
      // Den Stand nur austauschen, wenn sich etwas geändert hat – und dann immer neu zeichnen.
      // Sonst arbeitet die angezeigte Tabelle auf dem alten Stand weiter und Eingaben gehen verloren.
      if (canon(strip(merged)) !== before) { S = merged; saveLocal(); if (!force) render(); else pendingRender = true; }
    }
    if (!remote || (auth.key && !raw.enc) || canon(strip(S)) !== canon(strip(remote))) {
      const plain = JSON.stringify(strip(S));
      step = 'Hochladen';
      auth.etag = (await cloud.upload(token, auth.key ? JSON.stringify(await encryptText(plain)) : plain)).eTag;
      delete auth.overwrite;
    } else auth.etag = meta.eTag;
    if (dirtyGen === gen) auth.dirty = false; else scheduleSync(2500);
    auth.last = nowIso(); saveAuth(); setSync('ok');
  } catch (e) {
    console.error(e);
    if (!navigator.onLine) setSync('offline', 'Keine Verbindung – der Abgleich folgt automatisch.');
    else setSync('error', 'Schritt „' + step + '“: ' + e.message);
  } finally { syncing = false; }
}
let pendingRender = false;

async function syncDialog() {
  const info = h('p', { class: 'hint' });
  const describe = () => {
    if (!auth) info.textContent = 'Nicht angemeldet. Die Daten liegen nur auf diesem Gerät.';
    else if (auth.needLogin || syncState === 'login') info.textContent = 'Die Anmeldung ist abgelaufen. Bitte erneut anmelden; deine Einträge bleiben erhalten.';
    else if (auth.needPw) info.textContent = PW_MSG;
    else if (syncState === 'error') info.textContent = 'Fehler beim Abgleich: ' + syncMsg;
    else if (syncState === 'offline') info.textContent = 'Keine Verbindung. Der Abgleich folgt automatisch, sobald das Gerät wieder online ist.';
    else info.textContent = (auth.last ? 'Angemeldet. Letzter Abgleich: ' + fmtTs(auth.last, true) : 'Angemeldet. Noch kein Abgleich.') +
      (auth.key ? ' Verschlüsselung: aktiv.' : ' Verschlüsselung: aus.');
  };
  describe();
  const body = h('div', {},
    h('p', { class: 'hint' }, 'Das Notenbuch legt seine Daten in einem eigenen Ordner deiner OneDrive ab (Apps/Notenbuch) und gleicht sie auf allen angemeldeten Geräten automatisch ab. Auf andere Dateien hat es keinen Zugriff.'),
    info);
  const actions = [];
  if (!canSync) {
    body.append(h('p', { class: 'hint' }, 'Der Abgleich funktioniert nur unter ' + REDIRECT));
  } else if (!auth || auth.needLogin) {
    actions.push({ label: auth ? 'Erneut anmelden' : 'Mit Microsoft anmelden', primary: true, fn: async () => { await login(false); return KEEP; } });
  } else if (auth.needPw) {
    actions.push({ label: 'Passwort eingeben', primary: true, value: 'unlock' });
  } else {
    // Verschlüsselung ist vorbereitet, aber noch nicht freigeschaltet (erst muss der Abgleich stabil laufen).
    if (auth.key) actions.push({ label: 'Passwort ändern', value: 'set' });
    actions.push({ label: 'Jetzt abgleichen', fn: async () => { await sync(true); describe(); return KEEP; } });
  }
  if (auth) actions.unshift({ label: 'Abmelden', cls: 'danger left', value: 'logout' });
  actions.push({ label: 'Schließen', primary: !actions.some(a => a.primary), value: null });
  const r = await dlg('Automatischer Abgleich', body, actions);
  if (r === 'logout') { auth = null; saveAuth(); clearTimeout(syncTimer); setSync('off'); }
  if (r === 'unlock' || r === 'set') { await pwDialog(r); return syncDialog(); }
  if (pendingRender) { pendingRender = false; render(); }
}

async function startSync() {
  await handleRedirect();
  if (!auth) { setSync('off'); return; }
  // Die Microsoft-Anmeldung hält bei Web-Apps höchstens 24 Stunden. Beim Öffnen wird sie
  // deshalb einmal still erneuert; gelingt das nicht, bittet die App um eine neue Anmeldung.
  if (canSync && navigator.onLine && !auth.silentFailed && (auth.needLogin || Date.now() > (auth.rexp || 0))) { login(true); return; }
  if (auth.needLogin) { setSync('login', 'Bitte erneut bei Microsoft anmelden.'); return; }
  sync();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', () => sync());
setInterval(() => { if (!document.hidden) sync(); }, 60000);

document.getElementById('btnSync').addEventListener('click', syncDialog);
document.getElementById('btnBackup').addEventListener('click', backupDialog);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline-Modus nicht verfügbar:', e));
}
render();
startSync();
</script>
